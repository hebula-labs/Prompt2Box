# Install once with `pre-commit install`; the hooks then run on every commit.
# Run them over the whole tree with `pre-commit run --all-files`.
# Dependabot does not bump these revs; run `pre-commit autoupdate` periodically.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: detect-private-key

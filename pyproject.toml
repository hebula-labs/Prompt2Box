[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prompt2box"
version = "0.1.0"
description = "Gemini object detection in one import: labeled bounding boxes from a local image"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jin Tan Ruan" }]
maintainers = [{ name = "Hebula Labs" }]
keywords = [
    "gemini",
    "object-detection",
    "bounding-box",
    "computer-vision",
    "llm",
    "vertex-ai",
    "zero-shot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Floors reflect the APIs we actually use and test against (developed on
# google-genai 2.9, Pillow 11). google-genai pinned to the 2.x line because we
# rely on its typed errors (errors.APIError.code) and Part/Client/types surface;
# Pillow >= 10.1 for ImageFont.load_default(size=...).
dependencies = [
    "google-genai>=2.0.0",
    "pillow>=10.1.0",
    "pydantic>=2.0",  # used directly for the response_schema model (also a google-genai dep)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Formatter and type checker are pinned exactly (keep in sync with
    # .pre-commit-config.yaml). New releases change style and add checks, so
    # they should arrive as reviewable Dependabot PRs, not break main silently.
    "ruff==0.16.8",
    "mypy==2.3.1",
]
heic = ["pillow-heif>=0.13"]

[project.urls]
Homepage = "https://github.com/hebula-labs/Prompt2Box"
Repository = "https://github.com/hebula-labs/Prompt2Box"
Issues = "https://github.com/hebula-labs/Prompt2Box/issues"
Changelog = "https://github.com/hebula-labs/Prompt2Box/blob/main/CHANGELOG.md"

[project.scripts]
prompt2box = "prompt2box.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["prompt2box"]

[tool.hatch.build.targets.sdist]
# Keep the sdist to what is needed to build, test, and read about the package.
exclude = ["/.github", "/docs", "/eval", "/examples", "/.pre-commit-config.yaml", "/.editorconfig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true

[tool.coverage.run]
source = ["prompt2box"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Ruff 0.16+ formats Python code blocks inside Markdown by default. The README
# snippets use aligned trailing comments for readability, so keep Markdown out
# of both the linter and the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear, comprehensions
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length handled by formatter; long strings are intentional

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # google.genai / PIL ship partial or no stubs
warn_unused_ignores = true
files = ["prompt2box"]

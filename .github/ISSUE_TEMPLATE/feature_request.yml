name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketch the API or CLI flag if you have one in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or thought about, and why they fall short.
  - type: textarea
    id: scope
    attributes:
      label: Scope check
      description: Prompt2Box aims to stay a small, focused Gemini-detection wrapper. How does this fit that scope?
    validations:
      required: true

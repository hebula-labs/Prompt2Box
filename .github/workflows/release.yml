# Cut a release by pushing a version tag:
#
#   1. Bump `version` in pyproject.toml and CITATION.cff, move the CHANGELOG
#      "Unreleased" entries under a new version heading, and merge to main.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# The workflow re-runs the full quality gate (so a tag can never ship red
# code), checks that the tag matches the package version, builds the sdist and
# wheel, and attaches them to a GitHub Release with generated notes.
#
# Publishing to PyPI is opt-in. To enable it:
#   - create a "pypi" environment in the repository settings (optionally with
#     required reviewers), and
#   - register a PyPI Trusted Publisher for this repo + workflow file
#     (https://docs.pypi.org/trusted-publishers/), and
#   - set the repository variable PUBLISH_TO_PYPI to "true".
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  build:
    name: Build distributions
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify the tag matches pyproject.toml
        run: |
          pkg_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::tag v${tag_version} does not match pyproject.toml version ${pkg_version}"
            exit 1
          fi
          echo "releasing prompt2box ${pkg_version}"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    name: Publish to PyPI
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prompt2box/
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
